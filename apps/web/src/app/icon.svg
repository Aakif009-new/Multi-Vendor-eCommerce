<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>

  <!-- Subtle inner glowing border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25"/>

  <!-- Modern Storefront & Bag Symbol -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Store Roof / Canopy / Bag Handle -->
    <path d="M 60 110 C 60 40, 100 20, 160 20 C 220 20, 260 40, 260 110" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Store Front / Shopping Bag Body -->
    <path d="M 30 110 L 290 110 L 270 280 C 268 296, 254 308, 238 308 L 82 308 C 66 308, 52 296, 50 280 Z" fill="#ffffff"/>
    
    <!-- Cutout Accent / Store Door / Letter B Feature -->
    <path d="M 120 180 L 200 180 C 215 180, 225 190, 225 205 C 225 220, 215 230, 200 230 L 120 230 Z" fill="url(#brandGrad)"/>
    <path d="M 120 230 L 206 230 C 222 230, 234 242, 234 258 C 234 274, 222 286, 206 286 L 120 286 Z" fill="url(#brandGrad)"/>
    <rect x="120" y="180" width="22" height="106" rx="6" fill="url(#brandGrad)"/>

    <!-- Sparkle / Star in top-right -->
    <path d="M 270 50 Q 270 75, 295 75 Q 270 75, 270 100 Q 270 75, 245 75 Q 270 75, 270 50 Z" fill="#facc15"/>
  </g>
</svg>
