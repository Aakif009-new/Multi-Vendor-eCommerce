version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: marketplace_api
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    env_file:
      - ./apps/api/.env
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: marketplace_web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    env_file:
      - ./apps/web/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      api:
        condition: service_healthy
