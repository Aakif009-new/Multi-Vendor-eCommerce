name: CI Quality Gate & Build Verification

on:
  push:
    branches: [ main, master, develop, 'aakif/**', '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_key_2026' }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET || 'ci_test_cookie_secret_key_2026' }}
      CORS_ORIGIN: http://localhost:3000
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_TWo5jJDGLNDsBZ' }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'test_razorpay_key_secret_for_ci' }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET || 'bazaarone_razorpay_webhook_secret_2026' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'MULTI-VENDOR' }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'test_cloudinary_key' }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'test_cloudinary_secret' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'test_pexels_api_key' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🔐 Verify Secrets & Configuration
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL repository secret is missing! Please add DATABASE_URL in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "DATABASE_URL secret is configured."

      - name: 📦 Install Workspace Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: 🔍 Type-Check Express API
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: 🔍 Type-Check Next.js Frontend
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: 🧪 Run Backend Test Suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test --workspace=apps/api

      - name: 🏗️ Compile Express API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build --workspace=apps/api

      - name: 🚀 Production Build Next.js Frontend
        run: npm run build --workspace=apps/web

